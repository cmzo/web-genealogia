<body data-section="blog">

  <a href="#main-content" class="skip-link">Saltar al contenido</a>

  <header class="cmzo-top"><!-- la genera nav.js según data-section --></header>

  <main id="main-content" class="cmzo cmzo-wrap cmzo-page">
    <header class="blog-header">
      <h1 class="blog-header-title">Blog</h1>
      <p class="blog-header-subtitle">Investigaciones, historias y memoria familiar</p>
    </header>

    <section class="blog-grid" id="blogGrid">
      <div class="loading-cards">
        <div class="loading-spinner"></div>
        <p>Cargando posts…</p>
      </div>
    </section>
  </main>

  <footer class="cmzo-foot">
    <div class="cmzo-foot-inner">
      <div class="sig">// diseñado y mantenido por <b>Matías Clemenzo</b> · 2026</div>
      <div class="cmzo-foot-links"><a href="colaborar.html">colaborar</a><a href="changelog.html">cambios</a></div>
    </div>
  </footer>

  <script>
    async function loadBlogPosts() {
      try {
        const response = await fetch('./assets/data/blog-entries.json');
        const posts = await response.json();
        renderPosts(posts);
      } catch (error) {
        document.getElementById('blogGrid').innerHTML =
          '<p class="no-results">Error cargando los posts. Intentá recargar la página.</p>';
      }
    }

    // Familia temática de cada etiqueta → color de la pastilla. El color dice qué
    // TIPO de cosa es el tag; los que no están acá caen en el gris cálido neutro.
    const TAG_FAMILIA = {
      lugar: ['valais', 'riddes', 'ardon', 'salins', 'sion', 'conthey', 'suiza', 'argentina',
              'francia', 'santa fe', 'entre rios', 'entre ríos', 'colonia cullen', 'rosario'],
      familia: ['clemenzo', 'roh', 'roch', 'putallaz', 'queipo', 'arceo', 'francisco', 'stalder'],
      metodo: ['investigacion', 'investigación', 'genealogia', 'genealogía', 'documentos',
               'registros', 'archivo', 'censos', 'cronologia', 'cronología', 'fuentes',
               'gazette du valais', 'uxorilocalidad', 'metodologia', 'metodología'],
      tec: ['tecnologia', 'tecnología', 'llm', 'ia', 'pkm', 'wiki', 'obsidian', 'zettelkasten',
            'grafo', 'karpathy', 'okf'],
    };
    const FAM_DE = {};
    for (const [fam, tags] of Object.entries(TAG_FAMILIA)) for (const t of tags) FAM_DE[t] = fam;

    const normalizar = s => (s || '').toString().trim().toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '');

    // Categoría + hasta 2 etiquetas. Se prefieren etiquetas de una familia que la
    // tarjeta todavía no muestre: casi todos los posts son de «investigación», así que
    // sin esto las tres pastillas saldrían del mismo color y no dirían nada nuevo.
    function pastillas(post) {
      const cat = (post.category || '').trim();
      const vistos = new Set();
      const familiasUsadas = new Set();
      const salida = [];
      const agregar = etiqueta => {
        const clave = normalizar(etiqueta);
        if (!clave || vistos.has(clave) || salida.length >= 3) return;
        vistos.add(clave);
        const fam = FAM_DE[clave] || 'otro';
        familiasUsadas.add(fam);
        salida.push({ texto: etiqueta.trim(), fam });
      };
      if (cat) agregar(cat);

      const tags = (Array.isArray(post.tags) ? post.tags : (post.tags || '').split(','))
        .map(t => t.trim()).filter(Boolean)
        .filter(t => !vistos.has(normalizar(t)));
      const nuevas = tags.filter(t => !familiasUsadas.has(FAM_DE[normalizar(t)] || 'otro'));
      [...nuevas, ...tags].forEach(agregar);

      return salida.length
        ? `<div class="tag-pills">${salida.map(p =>
            `<span class="tag-pill" data-fam="${p.fam}">${p.texto}</span>`).join('')}</div>`
        : '';
    }

    function renderPosts(posts) {
      const grid = document.getElementById('blogGrid');
      if (!posts.length) {
        grid.innerHTML = '<p class="no-results">No hay posts disponibles.</p>';
        return;
      }
      const globe = '<svg class="lang-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18"/></svg>';
      grid.innerHTML = posts.map(post => {
        const langs = post.langs || [];
        const langBadge = langs.length > 1
          ? `<span class="blog-card-langs" title="Disponible en ${langs.map(l => l.toUpperCase()).join(', ')}">${globe}${langs.map(l => `<span class="lang-chip">${l}</span>`).join('')}</span>`
          : '';
        return `
        <a href="${post.url}" class="blog-card">
          <div class="blog-card-content">
            ${pastillas(post)}
            <h2 class="blog-card-title">${post.title}</h2>
            <p class="blog-card-desc">${post.description}</p>
            <div class="blog-card-meta"><span>${post.date}</span>${langBadge}</div>
          </div>
        </a>`;
      }).join('');
    }

    loadBlogPosts();
  </script>

<script src="assets/js/nav.js" defer></script>
