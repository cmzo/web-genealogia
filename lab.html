<html lang="es">
<head>

  <link rel="icon" href="./assets/images/favicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta property="og:title" content="Lab · Matías Clemenzo" />

</head>
<body data-section="lab">

  <a href="#main-content" class="skip-link">Saltar al contenido</a>
  <header class="cmzo-top"><!-- nav.js --></header>

  <main id="main-content" class="cmzo cmzo-wrap cmzo-page">

    <div class="lab-intro">
      <h1>Lab</h1>
      <p>Experimentos interactivos: tools para explorar ideas, visualizar datos y entender conceptos desde adentro. Cada laboratorio tiene sus propios diales.</p>
    </div>

    <div class="cmzo-gcards" id="labCards"><div class="loading-cards"><div class="loading-spinner"></div><p>Cargando…</p></div></div>

  </main>

  <footer class="cmzo-foot">
    <div class="cmzo-foot-inner">
      <div class="sig">// diseñado y mantenido por <b>Matías Clemenzo</b> · 2026</div>
      <div class="cmzo-foot-links"><a href="colaborar.html">colaborar</a><a href="changelog.html">cambios</a></div>
    </div>
  </footer>

  <script>
    // Tarjetas de color sólido (.cmzo-gcard, mismo componente que /gen y la
    // home). Cada indicador es un hecho real de la herramienta, no un
    // diagrama esquemático de lo que hace — mismo criterio que antes.
    const esc = t => (t || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function tarjeta(o) {
      return `<a class="cmzo-gcard ${o.cls || ''}" href="${o.href}">
        <div class="cmzo-gcard-top">
          <div class="cmzo-gcard-cluster"><span class="cmzo-gcard-badge">${esc(o.badge)}</span></div>
          <span class="cmzo-gcard-act" aria-hidden="true">→</span>
        </div>
        <h3>${esc(o.titulo)}</h3>
        <p>${esc(o.texto)}</p>
        <div class="cmzo-gcard-ind">${o.ind}</div>
      </a>`;
    }

    // Datos propios de cada herramienta que no salen de lab-entries.json
    // (cuántas fuentes/fractales/diales tiene de verdad, y su color de familia).
    const DATOS = {
      'laboratorio-editorial': {
        cls: 'cmzo-gcard--escritura', badge: 'Aa',
        texto: 'Maqueta viva de la tipografía de los posts: ancho de caja, fuente y tamaños con diales, y una receta copiable de los cambios.',
        ind: '15 fuentes <span>/ cuerpo y títulos</span>',
      },
      'laboratorio-de-fractales': {
        cls: 'cmzo-gcard--experim', badge: '4',
        texto: 'Koch, Sierpiński, árbol y curva dragón generados por L-systems, con iteraciones y ángulo en vivo.',
        ind: '4 fractales <span>/ L-systems en vivo</span>',
      },
      'laboratorio-del-grafo': {
        badge: '15',
        texto: 'El sandbox de la física que arma el grafo de la wiki: nodos, resortes y estética, todo en vivo.',
        ind: '15 parámetros <span>/ en vivo</span>',
      },
    };

    fetch('./assets/data/lab-entries.json').then(r => r.json()).then(entries => {
      const cont = document.getElementById('labCards');
      cont.innerHTML = entries.map(e => tarjeta({
        ...DATOS[e.id], href: e.kind === 'tool' ? e.url : `dist/lab/${e.id}.html`, titulo: e.title,
      })).join('');
    });
  </script>

  <script src="./assets/js/path-config.js"></script>
  <script src="./assets/js/nav.js" defer></script>
  <script src="./assets/js/nav-drawer.js" defer></script>
  <script src="./assets/js/theme.js" defer></script>
  <script src="./assets/js/command-palette.js" defer></script>

</body>
</html>
